name: Guardian CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Display .NET version
        run: dotnet --version

      - name: Restore solution
        run: dotnet restore Guardian.sln

      - name: Build solution
        run: dotnet build Guardian.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Guardian.sln --configuration Release --no-build --no-restore

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list Guardian.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') {
            throw 'Vulnerable NuGet packages detected.'
          }
